<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clawcase</title>
    <link rel="stylesheet" href="/styles.css?v=202603101546" />
  </head>
  <body>
    <div class="bg"></div>
    <header class="topbar">
      <a class="brand" href="#/">Clawcase</a>
      <nav>
        <a href="#/">发现</a>
        <a href="#/submit">提交用例</a>
      </nav>
    </header>

    <main id="app"></main>

    <template id="homeTpl">
      <section class="hero">
        <h1>Clawcase</h1>
        <p>Discover and reproduce real OpenClaw use cases.</p>
        <div class="heroActions">
          <a class="btn" href="#/submit">提交你的 Use Case</a>
        </div>
      </section>

      <section class="controls">
        <input id="searchInput" placeholder="搜索 use case（标题/详情/工作流/Prompt）" />
        <div class="filterBar">
          <div id="activeFilters" class="activeFilters"></div>
          <button id="clearFilters" class="clearBtn" type="button">清空筛选</button>
        </div>
      </section>
      <section class="sortRow">
        <div id="sortTabs" class="tabs"></div>
        <div class="rightTools">
          <div id="categoryTabs" class="tabs"></div>
          <button id="viewToggle" class="viewBtn" type="button">☰ 切换为列表</button>
        </div>
      </section>
      <section id="grid" class="listContainer"></section>
    </template>

    <template id="cardTpl">
      <article class="card">
        <div class="cardTop">
          <h3 class="title"></h3>
          <span class="date"></span>
        </div>
        <p class="summary"></p>
        <div class="meta"></div>
      </article>
    </template>

    <template id="detailTpl">
      <section class="detailWrap">
        <a href="#/" class="back">← 返回首页</a>
        <article class="detailCard">
          <section class="detailHero">
            <h1 class="dTitle"></h1>
            <p class="dSummary"></p>
            <div class="detailMeta"></div>
          </section>

          <h3>Use Case 详情</h3>
          <p class="dProblem"></p>

          <h3>工作流</h3>
          <pre class="dWorkflow"></pre>

          <h3>复现方式</h3>
          <p class="dReproMode"></p>
          <h3>复现 Prompt（给 OpenClaw）</h3>
          <pre class="dPrompt"></pre>
          <button class="btn copyBtn">复制 Prompt</button>
          <h3>手动复现流程</h3>
          <pre class="dManual"></pre>

          <h3>参考链接</h3>
          <ul class="dLinks"></ul>
        </article>
      </section>
    </template>

    <template id="submitTpl">
      <section class="submitWrap">
        <a href="#/" class="back">← 返回首页</a>
        <article class="submitCard">
          <h2>提交 Use Case（社区投稿）</h2>
          <p class="publicNotice">公开说明：你提交的内容将公开展示。请勿填写账号密码、密钥、内部链接等敏感信息。</p>
          <form id="submitForm">
            <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" />
            <label>标题 <span class="req">*</span><span class="hint">（公开，必填，≤140字）</span><input name="title" required maxlength="140" placeholder="例：用 OpenClaw 自动整理日报并推送飞书" /></label>
            <label>一句话总结 <span class="req">*</span><span class="hint">（公开，必填，1-2 句）</span><textarea name="summary" required placeholder="例：每天 18:00 自动汇总 GitHub + Feishu 动态并推送给团队"></textarea></label>
            <label>解决的问题 <span class="req">*</span><span class="hint">（公开，必填）</span><textarea name="problem" required placeholder="说明这个用例解决了什么痛点"></textarea></label>
            <label>工作流步骤 <span class="req">*</span><span class="hint">（公开，必填，建议分点）</span><textarea name="workflow" required placeholder="1) 输入数据源 2) 调度任务 3) 输出结果"></textarea></label>
            <label>复现 Prompt <span class="req">*</span><span class="hint">（公开，必填）</span><textarea name="reproPrompt" required placeholder="用于复现的完整 Prompt（请勿包含敏感信息）"></textarea></label>
            <label>分类 <span class="req">*</span><span class="hint">（公开，必选）</span>
              <select name="category" required>
                <option value="" selected disabled>请选择分类</option>
                <option>办公与效率</option>
                <option>运维与自动化</option>
                <option>研究与交易</option>
                <option>移动与硬件</option>
                <option>开发与构建</option>
                <option>其他</option>
              </select>
            </label>
            <label>使用工具 <span class="hint">（公开，选填，逗号分隔）</span><input name="tools" placeholder="如：OpenClaw, Feishu, Supabase" /></label>
            <label>标签 <span class="hint">（公开，选填，逗号分隔）</span><input name="tags" placeholder="如：自动化, 日报, 运营" /></label>
            <label>参考链接 <span class="hint">（公开，选填，每行一个）</span><textarea name="links" placeholder="https://..."></textarea></label>
            <label>提交者 <span class="hint">（公开，选填）</span><input name="submittedBy" placeholder="昵称或团队名" /></label>
            <button class="btn" type="submit">提交</button>
          </form>
          <p id="submitMsg"></p>
        </article>
      </section>
    </template>

    <script src="/app.js?v=202603101546"></script>
  </body>
</html>
